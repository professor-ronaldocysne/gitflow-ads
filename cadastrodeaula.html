<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastrodeaula.css">
    <title>Sistema Acadêmico</title>
</head>


<body>
        
        <div class="cadastro">
            <h2>Cadastro</h2>
            <form action="#" method="post">

        
           <div class="disciplina">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome da Disciplina" required>
            </div>


        <div class="codigo">
            <label for="codigo">Código</label>
            <input type="text" id="text" name="codigo" placeholder="Digite o Código da Matéria" required>

        </div>

        <div class="horaria">
             <label for="horaria">Carga Horária</label>
             <input type="text" id="text" name="codigo" placeholder="Digite sua Carga Horária" required>

        </div>

        <div class="semestre">
            <label for="semestre">Semestre</label>
            <input type="text" id="text" name="codigo" placeholder="Digite seu Semestre" required>

        </div>

        <div class="rofessor">
            <label for="professor">Professor</label>
            <input type="text" id="text" name="professor" placeholder="Professor Responsável" required>

        </div>
           








        <div class="butao">
            
        <button type="submit">Enviar</button>

        </div>
            

            </form>

        </div>

    
</body>



</html>
